='10' fill='#f1ebfd' stroke='#7c3aed' stroke-width='2'/><text x='510.0' y='217.0' font-family='Noto Sans, Segoe UI, Arial, sans-serif' font-size='14' fill='#7c3aed' text-anchor='middle' font-weight='700'>3   (o undefined)</text><text x='680' y='217' font-family='Noto Sans, Segoe UI, Arial, sans-serif' font-size='13' fill='#7c3aed' text-anchor='middle' font-weight='700'>un elemento</text><rect x='20' y='254' width='150' height='48' rx='10' fill='#f1f3f5' stroke='#5b6577' stroke-width='2'/><text x='95.0' y='283.0' font-family='Noto Sans, Segoe UI, Arial, sans-serif' font-size='14' fill='#5b6577' text-anchor='middle' font-weight='700'>[1, 2, 3, 4]</text><line x1='172' y1='278' x2='418' y2='278' stroke='#c77700' stroke-width='2.2' marker-end='url(#fc77700)'/><text x='295.0' y='269.0' font-family='JetBrains Mono, DejaVu Sans Mono, monospace' font-size='12' fill='#c77700' text-anchor='middle' font-weight='400'>reduce((acc, x) =&gt; acc + x, 0)</text><rect x='420' y='254' width='180' height='48' rx='10' fill='#fff4e0' stroke='#c77700' stroke-width='2'/><text x='510.0' y='283.0' font-family='Noto Sans, Segoe UI, Arial, sans-serif' font-size='14' fill='#c77700' text-anchor='middle' font-weight='700'>10</text><text x='680' y='283' font-family='Noto Sans, Segoe UI, Arial, sans-serif' font-size='13' fill='#c77700' text-anchor='middle' font-weight='700'>un solo valor</text></svg>
